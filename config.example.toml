# tsutawaru configuration. Copy to config.toml and edit.
# Every value below is the built-in default — an empty file behaves identically.

[audio]
device        = "auto"      # "auto" | index int | substring of device name
samplerate    = 16000       # target rate; capture runs at the device-native rate
blocksize_ms  = 20
channels      = 1
loopback      = false       # Windows only: use the PyAudioWPatch loopback backend
# How audio is captured.
#   "auto"     -> "process" on macOS 14.4+ with proc-tap and psutil installed,
#                 "device" everywhere else.
#   "process"  -> tap ONE application directly via a Core Audio process tap. No
#                 BlackHole, no Multi-Output Device, no output routing, and no
#                 other application's sound. Requires Screen Recording AND
#                 Microphone granted to "ProcTap Helper", and the tapped app must
#                 output to your system default device. Never falls back: if it
#                 cannot run, startup fails and says why.
#   "device"   -> capture an input device (virtual loopback: BlackHole, VB-CABLE).
#                 Records the whole system mix, so background audio is included.
backend       = "auto"      # "auto" | "device" | "process"
source        = "discord"   # backend="process" only: "discord" | "youtube"

[vad]
backend            = "silero"   # "silero" | "webrtc"  (webrtc needs Python 3.11)
threshold          = 0.55       # silero speech probability
aggressiveness     = 2          # webrtc 0..3
preroll_ms         = 320        # rounded to whole 32 ms windows
hangover_ms        = 448        # rounded to whole 32 ms windows
min_utterance_ms   = 350
max_utterance_ms   = 12000
# Show a transcript of speech still in progress once it passes this long, then
# replace it in place when the utterance closes. 0 disables it. Fires on ~29% of
# utterances on the recorded corpora, costs one extra STT pass each, and is
# skipped whenever STT is already behind, so it never delays a real line.
provisional_after_ms = 2500

[stt]
backend          = "auto"   # "auto" | "mlx" | "faster"
# qwen3 | qwen3-small (Qwen3-ASR, Apple Silicon only) | tiny | base | small |
# medium | kotoba (Whisper)
# "qwen3" is Qwen3-ASR-1.7B. Measured on 10.8 h of continuous stream audio,
# block-scored CER against YouTube captions (experiments/reports/
# model-bakeoff-20260920.md): it wins every clip and is 16% faster than the
# "kotoba" it replaced as the default on 2026-09-21.
#
#   model         A-chill  B-loud-game  C-collab  D-collab   avg     RTF
#   qwen3           0.210        0.449     0.429     0.310   0.350   0.128
#   qwen3-small     0.208        0.459     0.504     0.336   0.377   0.063
#   kotoba          0.223        0.486     0.562     0.381   0.413   0.153
#   medium          0.414        0.618     0.673     0.518   0.556   0.135
#
# "qwen3-small" is 2x faster for +0.027 CER, nearly all of it on multi-speaker
# audio — a good trade on solo streams, a poor one on collabs.
#
# Qwen3-ASR reports no avg_logprob and no no_speech_prob, so no_speech_thresh
# and logprob_floor below are INERT under either qwen3 model. Measured cost of
# losing them: 0.005 CER. They apply again under any Whisper model.
model            = "qwen3"
language         = "ja"
lang_mode        = "pinned" # "pinned" | "detect"
beam_size        = 1        # greedy = lowest latency
compute_type     = "auto"   # float16 | int8_float16 | int8
no_speech_thresh = 0.6
logprob_floor    = -1.0
# Vocabulary priming. Under model="qwen3" this is passed straight through to
# Qwen3-ASR's context-biasing input, which nudges recognition toward these words
# without them being transcribable. Whisper prepends it to the decoder history
# instead and can echo it back, so keep it short under kotoba.
#
# The FRAMING is load-bearing: lead with "Proper nouns:" or "Technical terms:".
# A bare comma list reads as text to continue rather than metadata about the
# audio, and measurably makes accuracy worse.
#
# Build the list from your own sessions, and verify every entry by hand. Left to
# itself the ASR spells an unfamiliar name a different way almost every time it
# hears one — a single speaker's handle came back eight ways in one recording
# here — so a list of its raw guesses biases recognition toward a wrong
# spelling. Keep only the entries you have confirmed:
# initial_prompt = "Proper nouns: <names you have verified>"
initial_prompt   = ""       # domain vocabulary priming

[nlp]
# "janome"  -> IPADIC, pure Python, no extra install. The default.
# "mecab"   -> IPADIC via MeCab.
# "unidic"  -> UniDic via fugashi. Needs `pip install fugashi` and a NINJAL
#              dictionary unpacked under ~/.local/share/tsutawaru/ (see
#              requirements.txt). Fails loudly if it cannot find one, rather
#              than quietly running janome instead.
tokenizer       = "janome"  # "janome" | "mecab" | "unidic"
unidic_dir      = ""        # empty = newest unidic-* under the path above
drop_pos        = ["記号", "補助記号", "空白", "フィラー", "その他"]
agglutinate     = true      # merge bound morphemes (です+ね -> ですね)
max_tokens      = 24
particle_romaji = "hepburn" # "hepburn" (は->wa) | "literal" (は->ha)

[translate]
# "mlx" runs the sentence lane on this machine with no network at all, using
# local_model below. On the CLI, --translator qwen3.5 names the model directly
# and sets local_model for you, the way --asr qwen3 does.
# Glosses come from JMdict for every provider — build it once with:
#   python -m tsutawaru.translate.jmdict
# CLI: --translator qwen3.5|google|deepl|none|mlx. A model name sets
# local_model too; "mlx" leaves it alone. "local" is the retired spelling of
# "mlx" and is still accepted.
#
# The default became "mlx" on 2026-09-29. Google's free endpoint has refused
# this machine with a 429 CAPTCHA continuously since 2026-09-20; the block is
# keyed on the IP and did not clear, so a network default shipped an app that
# could not translate. "mlx" is offline, Apple Silicon only, and measured at 2
# objective defects in 320 translations. Set "google" if your IP is clean.
provider           = "mlx"     # "mlx" | "google" | "deepl" | "none"
deepl_api_key      = ""
# Measured against Qwen3-4B-Instruct-2507, which it replaces: objective defects
# 5 -> 1 on a call and 13 -> 3 on a stream, names kept right 2/15 -> 7/15, for
# ~110 ms a line. A reasoning model — tsutawaru turns thinking off, without which
# a two-word line takes 15 s.
# CAT-Translate-1.4b was the budget alternative and was dropped on 2026-09-21:
# it leaks the prompt back as output under every prompt shape measured, 17-26
# defective lines per 160 against this model's 2. See local_mlx.REPO.
local_model        = "mlx-community/Qwen3.5-4B-MLX-4bit"
# How many lines of previous *English* output to feed the translator back as
# conversational context, on the sources that warrant it. Whether a source
# warrants it is decided by audio/sources.py: a YouTube stream is one voice, so
# the previous lines really are the same speaker; a Discord call alternates and
# tsutawaru cannot tell who is who, where the same context asserts the wrong
# person (measured: defects 5 -> 9, subject flips 63% -> 80% on 220 utterances).
# Set to 0 to disable it on every source.
local_context_lines = 3
gloss_workers      = 3         # sentence translation gets its own dedicated worker
sentence_timeout_s = 4.0
token_timeout_s    = 3.0
lru_size           = 20000
persist_cache      = true

[ui]
sink           = "window"   # "window" (tsutawaru GUI) | "console" | "overlay"
ws_port        = 8765
max_lines      = 200
show_romaji    = true
show_breakdown = true
plain          = false
log_file       = ""
